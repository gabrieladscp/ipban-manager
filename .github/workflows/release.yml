name: Release

# Publica uma versão no GitHub Releases, no formato que o Velopack (dentro do app) consome.
#
#   git tag v1.2.0           -> canal Stable   (Release normal)
#   git tag v1.3.0-beta.1    -> canal Beta     (Release marcada como pré-release)
#
# "Run workflow" manual (workflow_dispatch) compila e empacota sem publicar (dry run), útil para testar o pipeline.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão SemVer para o ensaio (ex.: 1.2.0 ou 1.3.0-beta.1)'
        required: true
      publish:
        description: 'Publicar de verdade? (false = apenas gera os artefatos)'
        type: boolean
        default: false

# Um release por vez: nunca dois pipelines publicando ao mesmo tempo.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write        # criar a Release e anexar arquivos
  id-token: write        # atestado de proveniência (Sigstore)
  attestations: write

env:
  # Mesma versão do pacote NuGet Velopack usado no app (src/IPBanManager.Infrastructure).
  # O formato dos pacotes do vpk e da biblioteca precisa ser compatível.
  VPK_VERSION: 1.2.161
  PACK_ID: IPBanManager

jobs:
  release:
    name: Compilar, empacotar e publicar
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------------- versão e canal
      - name: Validar versão semântica e definir o canal
        id: ver
        shell: pwsh
        run: |
          $raw = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}' }
          # SemVer 2.0 estrito; o único pré-release permitido é -beta.N
          $pattern = '^v?(?<v>(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-beta\.(?:0|[1-9]\d*))?)$'
          if ($raw -notmatch $pattern) {
            Write-Error "Versão '$raw' inválida. Use vMAJOR.MINOR.PATCH (Stable) ou vMAJOR.MINOR.PATCH-beta.N (Beta)."
            exit 1
          }
          $version = $Matches.v
          $isBeta  = $version.Contains('-')
          $channel = if ($isBeta) { 'beta' } else { 'stable' }
          $publish = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.publish }}' } else { 'true' }
          "version=$version"           >> $env:GITHUB_OUTPUT
          "channel=$channel"           >> $env:GITHUB_OUTPUT
          "prerelease=$($isBeta.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToLower())" >> $env:GITHUB_OUTPUT
          "tag=v$version"              >> $env:GITHUB_OUTPUT
          "### Release $version ($channel)" >> $env:GITHUB_STEP_SUMMARY

      - name: Versões estáveis só podem sair da branch main
        if: steps.ver.outputs.channel == 'stable' && steps.ver.outputs.publish == 'true'
        shell: pwsh
        run: |
          git fetch origin main --depth=1000
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            Write-Error "O commit ${env:GITHUB_SHA} não está na main. Versões Stable só podem ser publicadas a partir da main."
            exit 1
          }

      # ---------------------------------------------------------------- build + testes
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Testes (bloqueiam a publicação se falharem)
        run: dotnet test tests/IPBanManager.Tests -c Release --nologo

      - name: Publicar o aplicativo (Release)
        shell: pwsh
        run: |
          dotnet publish src/IPBanManager.Wpf/IPBanManager.Wpf.csproj -c Release -o publish --nologo `
            -p:Version=${{ steps.ver.outputs.version }} `
            -p:UpdateRepoUrl=https://github.com/${{ github.repository }}
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # A versão do executável precisa ser exatamente a da tag (o app compara versões SemVer).
          $info = (Get-Item publish/IPBanManager.exe).VersionInfo
          "Executável: FileVersion=$($info.FileVersion) ProductVersion=$($info.ProductVersion)"
          if (-not $info.ProductVersion.StartsWith('${{ steps.ver.outputs.version }}')) {
            Write-Error "ProductVersion '$($info.ProductVersion)' difere da versão '${{ steps.ver.outputs.version }}'."
            exit 1
          }

      # ---------------------------------------------------------------- empacotamento (Velopack)
      - name: Instalar o vpk (CLI do Velopack)
        run: dotnet tool install --global vpk --version ${{ env.VPK_VERSION }}

      - name: Baixar a Release anterior (mantém o feed do canal contínuo)
        shell: pwsh
        continue-on-error: true   # a primeira Release do canal ainda não tem anterior
        run: |
          $pre = @()
          if ('${{ steps.ver.outputs.prerelease }}' -eq 'true') { $pre = @('--pre') }
          vpk download github --repoUrl https://github.com/${{ github.repository }} `
            --token ${{ secrets.GITHUB_TOKEN }} --channel ${{ steps.ver.outputs.channel }} `
            --outputDir releases @pre

      - name: Notas da versão
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          CHANNEL: ${{ steps.ver.outputs.channel }}
          PUBLISH: ${{ steps.ver.outputs.publish }}
        run: |
          $notes = $null
          if ($env:PUBLISH -eq 'true') {
            $notes = gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name=$env:TAG --jq .body 2>$null
          }
          if (-not $notes) { $notes = "IPBan Manager $env:VERSION (canal $env:CHANNEL)" }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - name: Empacotar (Velopack)
        shell: pwsh
        run: |
          $extra = @()
          # Assinatura de código (opcional): defina a variável de repositório VPK_SIGN_PARAMS, ex.:
          #   /f cert.pfx /p senha /tr http://timestamp.digicert.com /td sha256 /fd sha256
          if ('${{ vars.VPK_SIGN_PARAMS }}' -ne '') { $extra += @('--signParams', '${{ vars.VPK_SIGN_PARAMS }}') }

          vpk pack `
            --packId ${{ env.PACK_ID }} `
            --packVersion ${{ steps.ver.outputs.version }} `
            --packDir publish `
            --mainExe IPBanManager.exe `
            --channel ${{ steps.ver.outputs.channel }} `
            --outputDir releases `
            --icon assets/app.ico `
            --packTitle "IPBan Manager" `
            --packAuthors Skytins `
            --releaseNotes release-notes.md `
            --delta None `
            @extra
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem releases | Select-Object Name, Length | Format-Table -AutoSize

      # ---------------------------------------------------------------- integridade
      - name: Gerar SHA256SUMS.txt
        shell: pwsh
        run: |
          Push-Location releases
          $files = Get-ChildItem -File | Where-Object { $_.Name -match '\.(exe|zip|nupkg|msi)$|^releases\..*\.json$' -and $_.Name -ne 'SHA256SUMS.txt' }
          $files | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h *$($_.Name)"
          } | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
          Pop-Location
          '```' >> $env:GITHUB_STEP_SUMMARY
          Get-Content releases/SHA256SUMS.txt >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY

      - name: Atestado de proveniência (quem/onde/como foi compilado)
        if: steps.ver.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            releases/*.exe
            releases/*.zip
            releases/*.nupkg

      - name: Guardar artefatos do build
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.ver.outputs.version }}
          path: releases/*
          retention-days: 30

      # ---------------------------------------------------------------- publicação
      - name: Publicar no GitHub Releases
        if: steps.ver.outputs.publish == 'true'
        shell: pwsh
        run: |
          $pre = @()
          if ('${{ steps.ver.outputs.prerelease }}' -eq 'true') { $pre = @('--pre') }
          vpk upload github `
            --repoUrl https://github.com/${{ github.repository }} `
            --token ${{ secrets.GITHUB_TOKEN }} `
            --outputDir releases `
            --channel ${{ steps.ver.outputs.channel }} `
            --releaseName "IPBan Manager ${{ steps.ver.outputs.version }}" `
            --tag ${{ steps.ver.outputs.tag }} `
            --targetCommitish ${{ github.sha }} `
            --publish --merge @pre
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Anexar SHA256SUMS.txt à Release
        if: steps.ver.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ steps.ver.outputs.tag }} releases/SHA256SUMS.txt --clobber --repo ${{ github.repository }}
